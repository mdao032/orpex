<header class="entete">
  <a class="marque" routerLink="/">{{ title }}</a>
  @if (auth.user(); as utilisateur) {
    <nav aria-label="Navigation principale">
      @for (entree of menu; track entree.chemin) {
        <a [routerLink]="entree.chemin" routerLinkActive="actif">{{ entree.libelle }}</a>
      }
      @if (auth.isAdmin()) {
        <a routerLink="/admin/comptes" routerLinkActive="actif">Comptes</a>
        <a routerLink="/admin/jours-feries" routerLinkActive="actif">Jours fériés</a>
      }
    </nav>
    <div class="session">
      <span class="utilisateur">{{ utilisateur.email }}</span>
      <a routerLink="/mot-de-passe" class="lien-session">Mot de passe</a>
      <button type="button" class="deconnexion" (click)="seDeconnecter()">Se déconnecter</button>
    </div>
  }
</header>

<main class="contenu">
  <router-outlet />
</main>
