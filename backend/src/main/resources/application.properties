# Configuration commune a tous les environnements.
# Les profils (application-<profil>.properties) ne contiennent que ce qui change.

spring.application.name=orpex

# Base de donnees
spring.datasource.url=${ORPEX_DB_URL:jdbc:postgresql://localhost:5435/orpex}
spring.datasource.username=${ORPEX_DB_USER:orpex}
spring.datasource.password=${ORPEX_DB_PASSWORD:orpex}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Relais SMTP
spring.mail.host=${ORPEX_SMTP_HOST:localhost}
spring.mail.port=${ORPEX_SMTP_PORT:1025}
# Nom annonce au serveur (EHLO) : evite une resolution DNS inverse du poste, lente sur certains reseaux.
spring.mail.properties.mail.smtp.localhost=${ORPEX_SMTP_HELO_NAME:orpex.local}
# Delais maximum (ms) : un relais qui ne repond plus ne doit pas bloquer le worker.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Cle de chiffrement des secrets au repos (mot de passe SMTP) : 32 octets en Base64. Jamais en base.
# Production : definir ORPEX_SECRET_KEY. Sans cle, aucun mot de passe SMTP ne peut etre enregistre.
orpex.secret-key=${ORPEX_SECRET_KEY:}
# Configuration SMTP par defaut ; l'ecran d'administration la remplace des qu'elle y est enregistree.
# Expediteur des relances (idealement une boite de service).
orpex.mail.from=${ORPEX_MAIL_FROM:relances@orpex.local}
orpex.mail.from-name=${ORPEX_MAIL_FROM_NAME:ORPEX - Relances}
# Worker d'envoi : frequence, taille d'un lot, et retard au-dela duquel un envoi n'est plus fait (manque).
orpex.worker.enabled=${ORPEX_WORKER_ENABLED:true}
orpex.worker.delay=PT30S
orpex.worker.batch-size=50
orpex.worker.max-lateness=PT15M
# Nouvelles tentatives apres un echec temporaire (serveur injoignable, code 4xx) : une par delai.
orpex.worker.retry-delays=PT1M,PT5M,PT15M
# Envoi reste "en cours" au-dela de ce delai (arret pendant l'envoi) : a verifier par l'utilisateur, jamais renvoye.
orpex.worker.sending-timeout=PT10M
# Controle de sante du relais SMTP (connexion sans envoi).
orpex.worker.smtp-health-interval=PT15M

# Arret du service : les requetes et un envoi en cours se terminent avant l'arret (sinon l'envoi passerait
# "a verifier"), dans la limite de 30 s.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

# Serveur et session
server.port=${ORPEX_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En production (HTTPS) : definir ORPEX_COOKIE_SECURE=true (automatique avec le profil "tls").
server.servlet.session.cookie.secure=${ORPEX_COOKIE_SECURE:false}
# Derriere un proxy HTTPS de la banque : ORPEX_FORWARD_HEADERS=native, pour que l'application sache que la requete
# d'origine etait en HTTPS (en-tetes X-Forwarded-*). A n'activer que si seul le proxy peut joindre l'application.
server.forward-headers-strategy=${ORPEX_FORWARD_HEADERS:none}

# Import Excel : taille maximale du fichier envoye.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Erreurs de l'API au format RFC 9457 (application/problem+json), message lisible dans "detail".
spring.mvc.problemdetails.enabled=true

# Journaux : texte lisible par defaut ; en production, JSON structure (une ligne par evenement) avec
# ORPEX_LOG_FORMAT=ecs (Elastic Common Schema ; aussi : logstash, gelf), pour un outil de collecte. Jamais de mot de
# passe ni de contenu de message ; les utilisateurs y sont designes par leur numero de compte (detail : journal d'audit).
logging.structured.format.console=${ORPEX_LOG_FORMAT:}
logging.structured.ecs.service.name=orpex
logging.structured.ecs.service.environment=${ORPEX_ENVIRONMENT:production}

management.endpoints.web.exposure.include=health
# Le relais SMTP se configure a l'ecran : il a son propre controle de sante (ecran Messagerie). Celui de Spring testerait
# spring.mail.* et rendrait l'application DOWN a tort.
management.health.mail.enabled=false

# Fuseau horaire unique de l'installation (fuseau IANA) : pilote au Mali. Un fuseau invalide bloque le demarrage.
orpex.timezone=${ORPEX_TIMEZONE:Africa/Bamako}
# Heure limite de validation, en minutes avant l'heure d'envoi.
orpex.validation-cutoff-minutes=30
# Recapitulatif des relances a valider, envoye ce delai avant l'heure limite (specification section 7).
orpex.validation-reminder-lead=PT1H
# Adresse de l'application, pour les liens dans les mails (production : definir ORPEX_APP_URL).
orpex.app-url=${ORPEX_APP_URL:http://localhost:8080}
# Premier administrateur : cree au demarrage seulement si la table users est vide, ignore ensuite.
orpex.bootstrap-admin.email=${ORPEX_ADMIN_EMAIL:}
orpex.bootstrap-admin.password=${ORPEX_ADMIN_PASSWORD:}
# Connexion : verrouillage temporaire du compte apres N echecs consecutifs (specification section 3).
orpex.login.max-failed-attempts=5
orpex.login.lock-duration=15m
# Mots de passe choisis par les utilisateurs : longueur seule, sans regle de complexite (ANSSI/OWASP).
orpex.password.min-length=12
orpex.password.max-length=128
