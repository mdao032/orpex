# HTTPS servi directement par ORPEX : profil "tls" (variable SPRING_PROFILES_ACTIVE=tls).
# Certificat du serveur et sa cle privee au format PEM (cle non chiffree, fichier lisible seulement par le service),
# delivres par l'autorite de certification interne de la banque. Derriere un proxy HTTPS, ne pas activer ce profil :
# voir ORPEX_FORWARD_HEADERS dans application.properties.
server.port=${ORPEX_PORT:8443}
server.ssl.enabled=true
server.ssl.certificate=${ORPEX_TLS_CERTIFICATE}
server.ssl.certificate-private-key=${ORPEX_TLS_PRIVATE_KEY}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Cookie de session envoye seulement en HTTPS.
server.servlet.session.cookie.secure=true
