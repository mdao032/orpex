# Profil de developpement local : a n'utiliser que sur un poste de developpeur.
# Active par scripts/dev.ps1 (mvn spring-boot:run -Dspring-boot.run.profiles=dev).
# Services attendus : docker compose up -d (PostgreSQL 17 sur 5435, Mailpit sur 1026/8026).

# Base PostgreSQL du docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5435/orpex
spring.datasource.username=orpex
spring.datasource.password=orpex

# Mailpit : rien ne part reellement, messages visibles sur http://localhost:8026
spring.mail.host=localhost
spring.mail.port=1026

# Cle de chiffrement de DEVELOPPEMENT uniquement (ne protege aucun secret reel) ; la production utilise ORPEX_SECRET_KEY.
orpex.secret-key=9TQpPMTx2Mavnc298//hI+jtMp0dsix7w0mO4uLJw4o=

# Premier administrateur, cree au demarrage seulement si la table users est vide
orpex.bootstrap-admin.email=admin@orpex.local
orpex.bootstrap-admin.password=${ORPEX_ADMIN_PASSWORD:dev-only-change-me}

# Liens des mails vers l'interface de developpement (ng serve).
orpex.app-url=http://localhost:4200

# HTTP sans TLS en local
server.servlet.session.cookie.secure=false

# Journaux
logging.level.com.orpex=DEBUG
logging.level.org.flywaydb=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
