# Profil de developpement local : a n'utiliser que sur un poste de developpeur.
# Active par scripts/dev.ps1 (mvn spring-boot:run -Dspring-boot.run.profiles=dev).
# Services attendus : docker compose up -d (PostgreSQL 17 sur 5435, Mailpit sur 1025/8025).

# Base PostgreSQL du docker-compose
spring.datasource.url=jdbc:postgresql://localhost:5435/orpex
spring.datasource.username=orpex
spring.datasource.password=orpex

# Mailpit : rien ne part reellement, messages visibles sur http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025

# Administrateur de demarrage (temporaire, en attendant la lecture de la table users)
orpex.bootstrap-admin.email=admin@orpex.local
orpex.bootstrap-admin.password=${ORPEX_ADMIN_PASSWORD:dev-only-change-me}

# HTTP sans TLS en local
server.servlet.session.cookie.secure=false

# Journaux
logging.level.com.orpex=DEBUG
logging.level.org.flywaydb=INFO
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
